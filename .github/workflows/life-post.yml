# A life entry posts itself: open an issue from the GitHub app, write the
# text, attach the photos, add the "life" label. This turns it into a
# formatted entry on life.html and commits it. Only issues opened by the
# repository owner are processed.
name: Life post
on:
  issues:
    types: [opened, labeled]
concurrency: life-post
permissions:
  contents: write
  issues: write
jobs:
  post:
    if: github.event.issue.user.login == github.repository_owner && contains(github.event.issue.labels.*.name, 'life')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install image tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick webp
      - name: Build the entry
        env:
          ISSUE_JSON: ${{ toJson(github.event.issue) }}
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/life_post.py
      - name: Commit
        env:
          TITLE: ${{ github.event.issue.title }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "life: $TITLE"
          git push
      - name: Close the issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment ${{ github.event.issue.number }} --repo ${{ github.repository }} --body "Posted to https://katsuma.ca/life.html"
          gh issue close ${{ github.event.issue.number }} --repo ${{ github.repository }}
