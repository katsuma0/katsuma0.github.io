# A life entry posts itself: open an issue from the GitHub app, write the
# text, attach the photos, add the "life" label. This writes the entry's
# life/data record, regenerates life.html with the shared renderer, and
# opens a pull request; merging that PR is the approval and the deploy,
# the same as the journal-export pipeline. Only issues opened by the
# repository owner are processed.
name: Life post
on:
  issues:
    types: [opened, labeled]
concurrency: life-post
permissions:
  contents: write
  issues: write
  pull-requests: write
jobs:
  post:
    if: github.event.issue.user.login == github.repository_owner && contains(github.event.issue.labels.*.name, 'life')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install image tools
        run: pip install --quiet pillow
      - name: Build the entry
        env:
          ISSUE_JSON: ${{ toJson(github.event.issue) }}
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/life_post.py
      - name: Open the pull request
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: ${{ github.event.issue.title }}
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "url=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          branch="life/issue-${{ github.event.issue.number }}-${{ github.run_id }}"
          git config user.name "life post"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add -A
          git commit -m "life: $TITLE"
          git push -u origin "$branch"
          url=$(gh pr create --base main --head "$branch" \
            --title "life: $TITLE" \
            --body "From issue #${{ github.event.issue.number }}. Merge this and it is live at katsuma.life.")
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Close the issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "${{ steps.pr.outputs.url }}" ]; then
            gh issue comment ${{ github.event.issue.number }} --repo ${{ github.repository }} --body "Opened ${{ steps.pr.outputs.url }} — merge it and this entry is live at https://katsuma.ca/life.html"
          else
            gh issue comment ${{ github.event.issue.number }} --repo ${{ github.repository }} --body "Nothing new to post from this issue (an entry with this name may already exist)."
          fi
          gh issue close ${{ github.event.issue.number }} --repo ${{ github.repository }}
