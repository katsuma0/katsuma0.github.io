    <script>
    /* If the on-camp repo is ever renamed to on-site, its old /on-camp/...
       addresses stop being a project site and fall through to this page.
       Forward them to the same path under the new name, so old bookmarks
       and installs keep opening the app. Until the rename, the project
       site owns /on-camp/ and this page never sees those requests. */
    (function () {
        var p = location.pathname;
        if (p.indexOf('/on-camp') === 0) {
            location.replace('/on-site' + p.slice('/on-camp'.length) + location.search + location.hash);
        }
    })();
    </script>
